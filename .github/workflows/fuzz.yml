name: Fuzz

# seed だけなら CI の go test で毎回回る。ここでは各ターゲットを長めに回して、新しい入力を探す。
on:
  schedule:
    - cron: "17 18 * * 0" # 毎週月曜 03:17（JST）
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "1 ターゲットあたりの時間（go test -fuzztime の形式）"
        default: "2m"

permissions:
  contents: read

# Action はタグの付け替えで中身が変わらないようにコミット SHA で固定する（コメントは対応するタグ）
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          check-latest: true
          cache-dependency-path: "**/go.sum"
      # 入力は式で run に埋め込まず、環境変数で渡す（シェルへの注入を避ける）
      - env:
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
        run: make fuzz FUZZTIME="$FUZZTIME"
      # 失敗した入力は testdata/fuzz/ に書かれる。手元で go test に渡して再現できるよう残す
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore
