name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Action はタグの付け替えで中身が変わらないようにコミット SHA で固定する（コメントは対応するタグ）
jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod の最低バージョンと、最新安定版の 2 系列で検証する（ADR-0002）
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          # go.work で束ねた全モジュールの go.sum をキャッシュキーにする
          cache-dependency-path: "**/go.sum"
      - run: go version
      - run: make vet
      - run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: "**/go.sum"
      # 速く終わる検査を先に回す
      - run: make fmt-check
      - run: make go-directive-check
      - run: make deps-check
      - run: make staticcheck
      - run: make vulncheck
