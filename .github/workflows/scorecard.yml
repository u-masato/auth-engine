name: Scorecard

# OpenSSF Scorecard（https://scorecard.dev）でリポジトリのサプライチェーンの健全性を評価し、
# 結果を Code scanning に載せる。publish_results で公開 API にも載せ、README のバッジに使えるようにする。
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 19 * * 0" # 毎週月曜 04:41（JST）
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

# Action はタグの付け替えで中身が変わらないようにコミット SHA で固定する（コメントは対応するタグ）
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Code scanning への SARIF のアップロード
      id-token: write # publish_results の署名
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
